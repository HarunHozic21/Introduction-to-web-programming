<div class="container" style="margin-top: 2rem; margin-bottom: 2rem;">

  <h1>Admin Dashboard</h1>
  <p>Manage products, users, and orders from this central hub.</p>
  <hr>

  <!-- Products Section -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <h2>Products</h2>
    <button class="btn btn-success" data-toggle="modal" data-target="#productModal" onclick="AdminPanel.openAddModal('product')">Add New Product</button>
  </div>
  <div class="table-responsive mt-3">
    <table id="products-table" class="table table-striped table-bordered" style="width:100%"></table>
  </div>

  <hr style="margin-top: 3rem; margin-bottom: 3rem;">

  <!-- Users Section -->
  <div class="d-flex justify-content-between align-items-center">
    <h2>Users</h2>
    <button class="btn btn-success" data-toggle="modal" data-target="#userModal" onclick="AdminPanel.openAddModal('user')">Add New User</button>
  </div>
  <div class="table-responsive mt-3">
    <table id="users-table" class="table table-striped table-bordered" style="width:100%"></table>
  </div>

  <hr style="margin-top: 3rem; margin-bottom: 3rem;">

  <!-- Orders Section -->
  <div class="d-flex justify-content-between align-items-center">
    <h2>Orders</h2>
    <button class="btn btn-success" data-toggle="modal" data-target="#orderModal" onclick="AdminPanel.openAddModal('order')">Add New Order</button>
  </div>
  <div class="table-responsive mt-3">
    <table id="orders-table" class="table table-striped table-bordered" style="width:100%"></table>
  </div>

</div>

<!-- MODALS START HERE (They are included here so they are available when the view is loaded) -->

<!-- Product Modal -->
<div class="modal fade" id="productModal" tabindex="-1" role="dialog" aria-labelledby="productModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="productModalLabel">Product Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <form id="productForm">
          <input type="hidden" id="product_id" name="product_id">
          <div class="form-group"><label for="product_name">Product Name</label><input type="text" class="form-control" id="product_name" name="name" required></div>
          <div class="form-group"><label for="product_brand">Brand</label><input type="text" class="form-control" id="product_brand" name="brand" required></div>
          <div class="form-group"><label for="product_price">Price</label><input type="number" class="form-control" id="product_price" name="price" step="0.01" required></div>
          <div class="form-group"><label for="product_stock">Stock</label><input type="number" class="form-control" id="product_stock" name="stock" required></div>
          <div class="form-group"><label for="product_description">Description</label><textarea class="form-control" id="product_description" name="description" rows="3"></textarea></div>
          <div class="form-group"><label for="product_image_url">Image URL</label><input type="text" class="form-control" id="product_image_url" name="image_url"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="AdminPanel.saveProduct()">Save Product</button>
      </div>
    </div>
  </div>
</div>

<!-- User Modal -->
<div class="modal fade" id="userModal" tabindex="-1" role="dialog" aria-labelledby="userModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="userModalLabel">User Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <input type="hidden" id="user_id" name="user_id">
          <div class="form-group"><label for="user_first_name">First Name</label><input type="text" class="form-control" id="user_first_name" name="first_name" required></div>
          <div class="form-group"><label for="user_last_name">Last Name</label><input type="text" class="form-control" id="user_last_name" name="last_name" required></div>
          <div class="form-group"><label for="user_email">Email</label><input type="email" class="form-control" id="user_email" name="email" required></div>
          <div class="form-group"><label for="user_password">Password</label><input type="password" class="form-control" id="user_password" name="password"><small class="form-text text-muted">Leave blank to keep current password when editing.</small></div>
          <div class="form-group"><label for="user_role">Role</label><select class="form-control" id="user_role" name="role" required><option value="USER">USER</option><option value="ADMIN">ADMIN</option></select></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="AdminPanel.saveUser()">Save User</button>
      </div>
    </div>
  </div>
</div>

<!-- Order Modal -->
<div class="modal fade" id="orderModal" tabindex="-1" role="dialog" aria-labelledby="orderModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="orderModalLabel">Order Details</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <form id="orderForm">
          <input type="hidden" id="order_id" name="order_id">
          <div class="form-group"><label for="order_user_id">User ID</label><input type="number" class="form-control" id="order_user_id" name="user_id" required></div>
          <div class="form-group"><label for="order_status">Status</label><select class="form-control" id="order_status" name="order_status" required><option value="PENDING">PENDING</option><option value="COMPLETED">COMPLETED</option><option value="CANCELLED">CANCELLED</option></select></div>
          <div class="form-group"><label for="order_total_price">Total Price</label><input type="number" class="form-control" id="order_total_price" name="total_price" step="0.01" required></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" onclick="AdminPanel.saveOrder()">Save Order</button>
      </div>
    </div>
  </div>
</div>
