<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <section class="d-flex justify-content-center align-items-center py-5" style="min-height: 100vh;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="card bg-white shadow-lg" style="border-radius: 1rem;">
              <div class="card-body p-5 text-center text-black">
                <div class="mb-md-5 mt-md-4 pb-5">
                  <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
                  <p class="mb-4">Please enter your email and password.</p>

                  <form id="login-form">
                    <div class="form-outline mb-4 text-start">
                      <label class="form-label" for="typeEmailX">Email</label>
                      <input type="email" name="email" id="typeEmailX" class="form-control form-control-lg" required />
                    </div>

                    <div class="form-outline mb-4 text-start">
                      <label class="form-label" for="typePasswordX">Password</label>
                      <input type="password" name="password" id="typePasswordX" class="form-control form-control-lg" required />
                    </div>

                    <p class="small mb-4 text-end">
                      <a class="text-dark" href="#passReset">Forgot password?</a>
                    </p>

                    <div class="d-grid">
                      <button class="btn btn-lg btn-primary px-5" type="submit">Login</button>
                    </div>
                  </form>

                  <div class="d-flex justify-content-center text-center mt-4">
                    <a href="#" class="text-dark"><i class="fab fa-facebook-f fa-lg"></i></a>
                    <a href="#" class="text-dark mx-3"><i class="fab fa-twitter fa-lg"></i></a>
                    <a href="#" class="text-dark"><i class="fab fa-google fa-lg"></i></a>
                  </div>
                </div>

                <div>
                  <p class="mb-0">Don't have an account? <a href="#registration" class="text-dark fw-bold">Sign Up</a></p>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- JS dependencies -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.17.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

    <!-- App scripts -->
    <script src="utils/constants.js"></script>
    <script src="utils/rest-client.js"></script>
    <script src="utils/utils.js"></script>
    <script src="services/user-service.js"></script>

    <script>
      UserService.init();
    </script>
  </body>
</html>
