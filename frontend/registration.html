<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <section class="d-flex justify-content-center align-items-center py-5" style="min-height: 100vh;">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8 col-xl-6">
            <div class="card bg-white shadow-lg" style="border-radius: 1rem;">
              <div class="card-body p-5 text-black">
                <h2 class="fw-bold mb-4 text-uppercase text-center">Register</h2>

                <form id="registration-form">
                  <div class="row">
                    <div class="col-md-6 mb-3">
                      <label for="firstName" class="form-label">First Name</label>
                      <input type="text" class="form-control" id="firstName" required />
                    </div>
                    <div class="col-md-6 mb-3">
                      <label for="lastName" class="form-label">Last Name</label>
                      <input type="text" class="form-control" id="lastName" required />
                    </div>
                  </div>

                  <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required />
                  </div>

                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required />
                  </div>

                  <div class="mb-3">
                    <label for="address" class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" />
                  </div>

                  <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" />
                  </div>

                  <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select id="role" class="form-select">
                      <option value="user" selected>User</option>
                      <option value="admin">Admin</option> <!-- Only for testing -->
                    </select>
                  </div>

                  <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Register</button>
                  </div>
                </form>

                <p class="mt-3 mb-0 text-center">
                  Already have an account? <a href="#login" class="text-dark fw-bold">Login here</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.17.0/jquery.validate.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastr@2.1.4/build/toastr.min.js"></script>

    <script src="utils/constants.js"></script>
    <script src="utils/rest-client.js"></script>
    <script src="utils/utils.js"></script>

    <script>
      $("#registration-form").validate({
        submitHandler: function (form) {
          const user = {
            first_name: $("#firstName").val(),
            last_name: $("#lastName").val(),
            email: $("#email").val(),
            password_hash: $("#password").val(),
            address: $("#address").val(),
            phone: $("#phone").val(),
            role: $("#role").val(),
          };

          RestClient.post("users", JSON.stringify(user), function () {
            toastr.success("Registration successful! You can now log in.");
            window.location.href = "login.html";
          });
        },
      });
    </script>
  </body>
</html>
