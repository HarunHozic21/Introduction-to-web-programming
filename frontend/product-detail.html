<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
</head>
<body>
  <!-- Product Detail Section -->
  <section class="py-5" id="product-detail-container">
    <div class="container px-4 px-lg-5 my-5">
      <div class="row gx-4 gx-lg-5 align-items-center" id="product-detail">
        <!-- JS will fill this -->
      </div>
    </div>
  </section>

  <!-- Related items -->
  <section class="py-5 bg-light">
    <div class="container px-4 px-lg-5 mt-5">
      <h2 class="fw-bolder mb-4">Related Products</h2>
      <div class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center" id="related-products">
        <!-- JS will insert related items -->
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
  <script src="utils/constants.js"></script>
  <script src="utils/utils.js"></script>
  <script src="utils/rest-client.js"></script>

  <script>
    const productId = localStorage.getItem("selected_product_id");

    if (!productId) {
      $("#product-detail").html(`<div class="col-12 text-center">No product selected.</div>`);
    } else {
      RestClient.get("products/" + productId, function (product) {
        const html = `
          <div class="col-md-6">
            <img class="card-img-top mb-5 mb-md-0" src="${product.image_url || 'https://via.placeholder.com/600x700'}" alt="${product.name}" />
          </div>
          <div class="col-md-6">
            <div class="small mb-1">Product ID: ${product.product_id}</div>
            <h1 class="display-5 fw-bolder">${product.name}</h1>
            <div class="fs-5 mb-5"><span>$${parseFloat(product.price).toFixed(2)}</span></div>
            <p class="lead">${product.description || ''}</p>
            <p class="mb-2">Brand: ${product.brand}</p>
            <div class="d-flex">
              <input class="form-control text-center me-3" id="inputQuantity" type="number" value="1" min="1" style="max-width: 3rem" />
              <button class="btn btn-outline-dark flex-shrink-0" onclick="CartService.addToCart(${product.product_id}, $('#inputQuantity').val())">
                <i class="bi-cart-fill me-1"></i> Add to cart
              </button>
            </div>
          </div>
        `;
        $("#product-detail").html(html);
      });

      RestClient.get("products", function (products) {
        const related = products.filter(p => p.product_id != productId).slice(0, 4);
        related.forEach(product => {
          $("#related-products").append(`
            <div class="col mb-5">
              <div class="card h-100">
                <img class="card-img-top" src="${product.image_url || 'https://via.placeholder.com/450x300'}" alt="${product.name}" />
                <div class="card-body p-4 text-center">
                  <h5 class="fw-bolder">${product.name}</h5>
                  $${parseFloat(product.price).toFixed(2)}
                </div>
                <div class="card-footer p-4 pt-0 bg-transparent border-top-0 text-center">
                  <button class="btn btn-outline-dark mt-auto" onclick="viewProduct(${product.product_id})">View</button>
                </div>
              </div>
            </div>
          `);
        });
      });
    }

    function viewProduct(id) {
      localStorage.setItem("selected_product_id", id);
      window.location.href = "product-detail.html";
    }
  </script>
</body>
</html>
